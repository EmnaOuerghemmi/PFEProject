# ============================================================================
# En-têtes de sécurité — inclus dans le bloc `server` ET dans chaque `location`
# qui pose son propre `add_header`.
# ----------------------------------------------------------------------------
# Pourquoi un fichier inclus : nginx n'hérite PAS des `add_header` du niveau
# supérieur dès qu'un bloc en déclare un lui-même. Déclarés une seule fois au
# niveau `server`, ces en-têtes disparaissaient donc d'index.html et de tous
# les fichiers statiques — c'est-à-dire de presque toutes les réponses.
# ============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Isole la fenêtre des pop-ups ouvertes par d'autres sites. « allow-popups » :
# la connexion Google ouvre SA pop-up et doit pouvoir répondre à la page.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# Aucune page n'utilise caméra, micro, géolocalisation ni paiement : on les
# interdit, y compris aux iframes tierces.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# CSP : la partie SCRIPTS est posée par Angular lui-même dans index.html
# (`security.autoCsp`, angular.json) — empreintes des scripts en ligne +
# 'strict-dynamic', ce qui autorise aussi le SDK Google chargé par l'appli.
# Ici, le reste : pas de plugins, pas de <base> détourné, pas d'affichage de
# l'appli dans une iframe étrangère, formulaires vers l'appli seulement.
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

# HSTS n'a d'effet qu'en HTTPS : il se pose sur le terminateur TLS qui sera
# placé devant ce conteneur (servi ici en HTTP), pas dans ce fichier.
