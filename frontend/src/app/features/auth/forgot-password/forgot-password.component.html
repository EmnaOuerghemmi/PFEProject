<main class="forgot-page">

  <!-- Animated Background Blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Center Card -->
  <div class="forgot-card">

    <!-- Brand -->
    <div class="brand">
      <h1 class="brand-name">PIQBIT</h1>
      <p class="brand-tagline">Réinitialiser votre mot de passe</p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="requestReset()" novalidate>

      <!-- Error Alert -->
      <div class="error-alert" *ngIf="errorMessage">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ errorMessage }}
      </div>

      <!-- Success Alert -->
      <div class="success-alert" *ngIf="successMessage">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        {{ successMessage }}
      </div>

      <!-- Email Field -->
      <div class="field">
        <label>Adresse email</label>
        <div class="input-wrap">
          <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" [(ngModel)]="email" name="email" placeholder="vous@piqbit.tn" autocomplete="email" required />
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading" class="btn-inner">
          Réinitialiser mon mot de passe
          <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </span>
        <span *ngIf="isLoading" class="btn-loading">
          <span class="spinner"></span>
          Envoi en cours...
        </span>
      </button>

      <!-- Back to Login -->
      <p class="back-link">
        <a routerLink="/login">← Retour à la connexion</a>
      </p>

    </form>

    <p class="footer-text">&copy; {{ currentYear }} PIQBIT — Tunisie, Afrique &amp; Europe</p>
  </div>
</main>
