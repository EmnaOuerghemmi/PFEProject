<main class="reset-page">

  <!-- Animated Background Blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Center Card -->
  <div class="reset-card">

    <!-- Brand -->
    <div class="brand">
      <h1 class="brand-name">PIQBIT</h1>
      <p class="brand-tagline">Créer un nouveau mot de passe</p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="resetPassword()" novalidate>

      <!-- Error Alert -->
      <div class="error-alert" *ngIf="errorMessage">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ errorMessage }}
      </div>

      <!-- Success Alert -->
      <div class="success-alert" *ngIf="successMessage">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        {{ successMessage }}
      </div>

      <!-- New Password -->
      <div class="field">
        <label>Nouveau mot de passe</label>
        <div class="input-wrap">
          <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="••••••••" required />
          <button type="button" class="eye-toggle" (click)="showPassword = !showPassword"
                  [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <!-- Strength bar -->
        <div class="strength-bar" *ngIf="password">
          <div class="strength-track">
            <div class="strength-fill" [style.width.%]="passwordStrength * 20" [class]="'s' + passwordStrength"></div>
          </div>
          <span class="strength-label" [class]="'s' + passwordStrength">{{ strengthLabel }}</span>
        </div>
        <p class="password-hint">8 caractères min. · Majuscule · Minuscule · Chiffre · Caractère spécial</p>
      </div>

      <!-- Confirm Password -->
      <div class="field">
        <label>Confirmer le mot de passe</label>
        <div class="input-wrap" [class.mismatch]="confirmPassword && password !== confirmPassword">
          <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <input [type]="showConfirm ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••••" required />
          <button type="button" class="eye-toggle" (click)="showConfirm = !showConfirm"
                  [attr.aria-label]="showConfirm ? 'Masquer la confirmation' : 'Afficher la confirmation'">
            <svg *ngIf="!showConfirm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showConfirm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <p class="mismatch-hint" *ngIf="confirmPassword && password !== confirmPassword">Les mots de passe ne correspondent pas</p>
      </div>

      <!-- Submit -->
      <button type="submit" class="submit-btn" [disabled]="isLoading || !token">
        <span *ngIf="!isLoading" class="btn-inner">
          Réinitialiser le mot de passe
          <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </span>
        <span *ngIf="isLoading" class="btn-loading">
          <span class="spinner"></span>
          Traitement en cours...
        </span>
      </button>

      <!-- Back to Login -->
      <p class="back-link">
        <a routerLink="/login">← Retour à la connexion</a>
      </p>

    </form>

    <p class="footer-text">&copy; {{ currentYear }} PIQBIT — Tunisie, Afrique &amp; Europe</p>
  </div>
</main>
