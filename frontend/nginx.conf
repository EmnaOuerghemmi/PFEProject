# ============================================================================
# PIQBIT — service du frontend Angular + proxy vers l'API
# ----------------------------------------------------------------------------
# Frontend et backend sont servis depuis la MÊME origine : le navigateur
# n'émet donc aucune requête cross-origin, et les URL d'API restent relatives
# (`/api/v1/...`). Conséquence pratique : l'image frontend est identique en
# recette et en production, aucun rebuild n'est nécessaire pour changer de
# domaine d'API.
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression : les bundles Angular sont très compressibles (~1,8 Mo -> ~400 Ko).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    gzip_comp_level 6;

    # En-têtes de sécurité : voir security-headers.conf. Répétés dans chaque
    # `location` qui pose son propre `add_header`, sinon nginx les oublie.
    include /etc/nginx/snippets/security-headers.conf;

    # ─── API REST ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Analyse de CV et génération de rapports peuvent être longues.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Téléversement de CV (PDF).
        client_max_body_size 25m;
    }

    # ─── WebSocket (notifications temps réel, négociation) ─────────────────
    # Bloc distinct : la montée en WebSocket exige `Upgrade`/`Connection`, et
    # un `proxy_read_timeout` long pour ne pas couper les connexions inactives.
    location ~ ^/api/v1/(notifications/ws|negotiations/ws) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # ─── Fichiers statiques ────────────────────────────────────────────────
    # Les bundles Angular portent une empreinte dans leur nom : ils peuvent
    # être mis en cache indéfiniment sans risque d'obsolescence.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # ─── Repli SPA ─────────────────────────────────────────────────────────
    # Le routeur Angular gère les URL côté client : toute route inconnue doit
    # renvoyer index.html, sinon un rafraîchissement sur /admin/dashboard
    # produirait un 404 nginx.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html ne doit JAMAIS être mis en cache : il référence les
        # bundles empreintés, un cache figé servirait d'anciens fichiers.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
