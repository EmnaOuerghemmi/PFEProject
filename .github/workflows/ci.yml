# ============================================================================
# Intégration continue PIQBIT — cinq jobs indépendants, en parallèle :
#
#   1. codescene    qualité du code (CodeScene, Code Health des changements)
#   2. semgrep      sécurité du code (analyse statique)
#   3. gitleaks     sécurité du dépôt (secrets dans l'historique git)
#   4. lighthouse   performance du frontend (Lighthouse CI)
#   5. docker       vérification du build des images backend et frontend
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Une nouvelle poussée annule le run précédent d'une branche de travail.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '22'
  SEMGREP_IMAGE: semgrep/semgrep:1.179.0
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  LHCI_VERSION: '0.15.1'

jobs:
  codescene:
    name: Qualité du code — CodeScene
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # la comparaison a besoin des deux commits
          persist-credentials: false
      - name: Installer la CLI CodeScene
        run: |
          curl -fsSL https://downloads.codescene.io/enterprise/cli/install-cs-tool.sh | sh -s -- -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Code Health des changements (cs delta)
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
          EVENEMENT: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          HEAD_PR: ${{ github.event.pull_request.head.sha }}
          AVANT: ${{ github.event.before }}
        run: |
          if [[ -z "$CS_ACCESS_TOKEN" ]]; then
            echo "::warning::Secret CS_ACCESS_TOKEN absent : analyse CodeScene sautée."
            exit 0
          fi
          if [[ "$EVENEMENT" == "pull_request" ]]; then
            base="$BASE_PR"; tete="$HEAD_PR"
          elif [[ -n "$AVANT" && "$AVANT" != 0000000000000000000000000000000000000000 ]]; then
            base="$AVANT"; tete="$GITHUB_SHA"
          else
            base="HEAD~1"; tete="HEAD"
          fi
          cs delta --output-format json "$base" "$tete" > delta.json
          if [[ "$(jq 'length' delta.json)" -gt 0 ]]; then
            cs delta "$base" "$tete"
            echo "::error::La Code Health baisse dans les fichiers modifiés."
            exit 1
          fi
          echo "Aucune baisse de Code Health."

  semgrep:
    name: Sécurité du code — Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep scan (règles p/default)
        run: |
          docker run --rm -v "$PWD:/src" -w /src --user "$(id -u):$(id -g)" -e HOME=/tmp \
            "$SEMGREP_IMAGE" semgrep scan --config p/default --metrics=off --error

  gitleaks:
    name: Sécurité du dépôt — Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # tout l'historique : un secret supprimé reste dans git
          persist-credentials: false
      - name: gitleaks git (historique complet, secrets masqués)
        run: |
          docker run --rm -v "$PWD:/repo" --user "$(id -u):$(id -g)" \
            "$GITLEAKS_IMAGE" git --redact --no-banner -v /repo

  lighthouse:
    name: Performance du frontend — Lighthouse CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci --no-fund
      - name: Build de production
        run: npm run build -- --configuration production
      - name: Lighthouse CI (3 passages, médiane)
        run: |
          cat > "$RUNNER_TEMP/lighthouserc.json" <<'EOF'
          {
            "ci": {
              "collect": { "staticDistDir": "./dist/frontend/browser", "numberOfRuns": 3 },
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", { "minScore": 0.8 }],
                  "categories:accessibility": ["error", { "minScore": 0.9 }],
                  "categories:best-practices": ["error", { "minScore": 0.9 }],
                  "categories:seo": ["warn", { "minScore": 0.9 }]
                }
              },
              "upload": { "target": "filesystem", "outputDir": "./.lighthouseci-rapports" }
            }
          }
          EOF
          npx --yes "@lhci/cli@${LHCI_VERSION}" autorun --config="$RUNNER_TEMP/lighthouserc.json"
      - name: Publier les rapports Lighthouse
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-rapports
          path: frontend/.lighthouseci-rapports/
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: Vérification du build Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build de l'image backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build de l'image frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
