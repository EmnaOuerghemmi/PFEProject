# ============================================================================
# Intégration continue PIQBIT
# ----------------------------------------------------------------------------
# Jobs indépendants, en parallèle, chacun lancé seulement si sa partie du code
# a changé (toujours tous sur main et sur une étiquette de version) :
#
#   workflows        actionlint + shellcheck (workflows et scripts de déploiement)
#   backend-qualite  ruff (bugs, failles) + pip-audit (dépendances vulnérables)
#   backend-tests    contrôle de dérive des migrations + pytest + couverture
#   frontend         npm audit + typage + build de production + tests + couverture
#   docker           build des images, Trivy, puis VRAI déploiement de la pile
#                    avec deploy/deploy.sh : sauvegarde, migrations, health
#                    checks, vérification de bout en bout, et retour arrière
#                    automatique sur une version volontairement cassée
#   ci-ok            synthèse — la seule vérification à exiger avant fusion
#
# Release (.github/workflows/release.yml) ne publie qu'après un CI vert : sur
# main (puis déploie la recette) ou sur une étiquette vX.Y.Z (la production se
# déploie ensuite à la main).
#
# Les mêmes contrôles tournent en local, sans GitHub : bash scripts/ci-local.sh
# ============================================================================

name: CI

# Une branche de travail est vérifiée par sa pull request (même en brouillon),
# ou à la demande (Actions › CI › Run workflow). Déclencher aussi sur chaque
# poussée de branche lancerait deux fois la même CI par PR — y compris pour
# chaque PR Dependabot — et doublerait les minutes consommées.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore:
      - 'report/**'
      - '**/*.md'
      - '**/*.docx'
      - '**/*.png'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Une nouvelle poussée annule le build précédent d'une branche de travail.
# Jamais sur main ni sur une étiquette : la publication dépend de chaque run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '22'
  TORCH_VERSION: '2.13.0'
  TRIVY_IMAGE: aquasec/trivy:0.75.0
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0

jobs:
  changements:
    name: Périmètre des changements
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.tout.outputs.tout == 'true' || steps.filtre.outputs.backend == 'true' }}
      frontend: ${{ steps.tout.outputs.tout == 'true' || steps.filtre.outputs.frontend == 'true' }}
      docker: ${{ steps.tout.outputs.tout == 'true' || steps.filtre.outputs.docker == 'true' }}
      workflows: ${{ steps.tout.outputs.tout == 'true' || steps.filtre.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tout
        name: Tout vérifier sur main, sur une étiquette ou à la demande
        env:
          REF: ${{ github.ref }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          if [[ "$REF" == "refs/heads/main" || "$REF" == refs/tags/* || "$EVENEMENT" == "workflow_dispatch" ]]; then
            echo "tout=true" >> "$GITHUB_OUTPUT"
          else
            echo "tout=false" >> "$GITHUB_OUTPUT"
          fi
      - id: filtre
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            docker:
              - 'backend/**'
              - 'frontend/**'
              - 'deploy/**'
            workflows:
              - '.github/**'
              - 'deploy/*.sh'
              - 'scripts/**'

  workflows:
    name: Workflows et scripts
    needs: changements
    if: needs.changements.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (syntaxe, expressions, injections dans les workflows)
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color
      - name: shellcheck (scripts de déploiement et CI locale)
        run: docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK_IMAGE" --severity=warning deploy/*.sh scripts/*.sh

  backend-qualite:
    name: Backend — qualité et sécurité
    needs: changements
    if: needs.changements.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Installer les outils (versions figées de requirements-dev.txt)
        run: |
          grep -E '^(ruff|pip-audit)==' requirements-dev.txt > /tmp/outils.txt
          python -m pip install --disable-pip-version-check -r /tmp/outils.txt
      - name: ruff — bugs et failles (règles dans ruff.toml)
        run: ruff check . --output-format=github
      - name: pip-audit — dépendances vulnérables
        run: |
          # Les exceptions, justifiées une à une, vivent dans .pip-audit-ignore.
          mapfile -t exceptions < <(grep -vE '^\s*(#|$)' .pip-audit-ignore)
          args=()
          for id in "${exceptions[@]}"; do args+=(--ignore-vuln "$id"); done
          pip-audit -r requirements.txt --no-deps --disable-pip --progress-spinner off "${args[@]}"

  backend-tests:
    name: Backend — migrations et tests
    needs: changements
    if: needs.changements.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        # Même image qu'en production : la recherche sémantique s'appuie sur pgvector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: piqbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Aucune configuration ne vient d'un fichier .env en CI : tout est ici.
      # Les tests eux-mêmes tournent sur SQLite (tests/conftest.py) ; la base
      # PostgreSQL sert au contrôle des migrations.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/piqbit_test
      SECRET_KEY: ci-secret-sans-usage-en-production
      REDIS_URL: redis://localhost:6379
      EMBEDDINGS_BACKEND: hash
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Installer les dépendances
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          # torch depuis l'index CPU : la roue par défaut embarque ~2,5 Go de CUDA inutile ici.
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}"
          pip install -r requirements-dev.txt

      - name: Migrations — application complète sur PostgreSQL
        run: alembic upgrade head

      - name: Migrations — aucun modèle modifié sans migration
        # Compare les modèles à la base tout juste migrée (types et valeurs par
        # défaut compris, cf. alembic/env.py) : la moindre différence signifie
        # qu'un modèle a changé sans migration, le schéma dériverait en production.
        run: alembic check

      - name: Migrations — retour arrière d'une révision puis réapplication
        run: |
          # Une migration dont le downgrade est cassé empêche tout retour en
          # arrière en urgence : on le vérifie à chaque changement.
          alembic downgrade -1
          alembic upgrade head

      - name: Tests et couverture
        run: >-
          pytest -q --no-header -p no:cacheprovider
          --cov=app --cov-report=term --cov-report=xml:coverage.xml
          --junitxml=junit.xml

      - name: Résumé de la couverture
        if: always() && hashFiles('backend/coverage.xml') != ''
        run: |
          taux=$(python -c "import xml.etree.ElementTree as e; print(round(float(e.parse('coverage.xml').getroot().get('line-rate'))*100, 1))")
          echo "### Backend — couverture des lignes : ${taux} %" >> "$GITHUB_STEP_SUMMARY"

      - name: Publier les rapports de test
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-rapports
          path: |
            backend/junit.xml
            backend/coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  frontend:
    name: Frontend — audit, typage, build, tests
    needs: changements
    if: needs.changements.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances (lockfile strict)
        run: npm ci --no-fund

      - name: npm audit — bloquant sur les vulnérabilités CRITIQUES livrées en production
        run: npm audit --omit=dev --audit-level=critical

      - name: npm audit — rapport complet (non bloquant)
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### Frontend — vulnérabilités des dépendances de production"
            echo '```'
            npm audit --omit=dev 2>&1 | tail -n 15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Typage (application et tests)
        run: npm run typecheck

      - name: Build de production
        run: npm run build -- --configuration production

      - name: Tests unitaires et couverture
        run: npm run test:ci

      - name: Publier la couverture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-couverture
          path: frontend/coverage/
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: Docker — images, analyse et déploiement de test
    needs: changements
    if: needs.changements.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: piqbit-ci
      WAIT_TIMEOUT: '600'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construire l'image backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: local/piqbit-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construire l'image frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          load: true
          tags: local/piqbit-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy — bloquant sur les vulnérabilités CRITIQUES corrigeables
        run: |
          for image in local/piqbit-backend:ci local/piqbit-frontend:ci; do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image"
            echo "::endgroup::"
          done

      - name: Trivy — rapport HIGH (non bloquant)
        if: always()
        continue-on-error: true
        run: |
          for image in local/piqbit-backend:ci local/piqbit-frontend:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --scanners vuln --severity HIGH --ignore-unfixed --no-progress --format table "$image" | tail -n 40
          done

      - name: Préparer un environnement de test jetable
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i "s|^IMAGE_REGISTRY=.*|IMAGE_REGISTRY=local|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" .env
          sed -i "s|^HTTP_BIND=.*|HTTP_BIND=127.0.0.1:8080|" .env
          sed -i "s|^SMOKE_URL=.*|SMOKE_URL=http://127.0.0.1:8080|" .env
          cp backend.env.example backend.env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 64)|" backend.env
          sed -i "s|^FRONTEND_BASE_URL=.*|FRONTEND_BASE_URL=http://127.0.0.1:8080|" backend.env
          echo "EMBEDDINGS_BACKEND=hash" >> backend.env

      - name: Déploiement réel avec deploy.sh (sauvegarde, migrations, health checks, vérification)
        working-directory: deploy
        run: bash deploy.sh deploy ci --no-pull

      - name: Retour arrière automatique sur une version cassée
        working-directory: deploy
        run: |
          # Une « nouvelle version » dont le backend s'arrête aussitôt : le
          # déploiement doit échouer ET rétablir seul la version « ci ».
          printf 'FROM local/piqbit-backend:ci\nCMD ["false"]\n' | docker build -q -t local/piqbit-backend:ci-cassee -
          docker tag local/piqbit-frontend:ci local/piqbit-frontend:ci-cassee
          set +e
          WAIT_TIMEOUT=180 bash deploy.sh deploy ci-cassee --no-pull --skip-migrations
          code=$?
          set -e
          if [[ $code -ne 1 ]]; then
            echo "::error::Code $code attendu 1 (échec avec retour arrière réussi)."
            exit 1
          fi
          bash smoke-test.sh http://127.0.0.1:8080
          test "$(cat .etat/actuelle)" = "ci"

      - name: Retour arrière manuel (commande rollback)
        working-directory: deploy
        run: |
          # On remet « ci » sous une seconde étiquette puis on revient en arrière.
          docker tag local/piqbit-backend:ci local/piqbit-backend:ci-bis
          docker tag local/piqbit-frontend:ci local/piqbit-frontend:ci-bis
          bash deploy.sh deploy ci-bis --no-pull
          bash deploy.sh rollback
          test "$(cat .etat/actuelle)" = "ci"
          bash deploy.sh status

      - name: Journaux en cas d'échec
        if: failure()
        working-directory: deploy
        run: |
          IMAGE_TAG=ci docker compose -f docker-compose.prod.yml ps || true
          IMAGE_TAG=ci docker compose -f docker-compose.prod.yml logs --no-color --tail 200 || true

      - name: Nettoyer
        if: always()
        working-directory: deploy
        run: IMAGE_TAG=ci docker compose -f docker-compose.prod.yml down -v --remove-orphans || true

  ci-ok:
    name: CI — synthèse
    if: always()
    needs: [changements, workflows, backend-qualite, backend-tests, frontend, docker]
    runs-on: ubuntu-24.04
    steps:
      - name: Tous les jobs lancés ont réussi
        env:
          RESULTATS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTATS"
          for r in $RESULTATS; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::Au moins un job a échoué ou a été annulé."
              exit 1
            fi
          done
