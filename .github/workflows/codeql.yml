# ============================================================================
# CodeQL — analyse de sécurité du code (SAST), Python et TypeScript
# ----------------------------------------------------------------------------
# Gratuit pour un dépôt public. Les alertes apparaissent dans
# Security › Code scanning. Requêtes « security-extended » : injections, XSS,
# chemins non maîtrisés, secrets, désérialisation…
# ============================================================================

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'   # chaque lundi : de nouvelles requêtes paraissent sans changement de code

permissions:
  contents: read

jobs:
  analyse:
    name: CodeQL — ${{ matrix.langage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        langage: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.langage }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - backend/venv
              - backend/tests
              - frontend/node_modules
              - report
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.langage }}
