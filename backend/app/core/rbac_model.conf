# Modèle Casbin — RBAC « rôle → ressource → action ».
#
# Volontairement PAS le modèle REST (chemin + verbe HTTP) : une politique
# écrite sur les URL se désynchronise au premier renommage de route, et se
# relit mal. Ici la politique parle du métier — « le recruteur peut écrire
# sur les candidatures » — et chaque endpoint déclare la ressource et
# l'action qu'il engage.
#
# `g` porte l'héritage entre rôles : RH hérite de RECRUTEUR, ADMIN de RH.
# Une permission accordée au recruteur remonte donc automatiquement, et la
# politique ne répète pas trois fois les mêmes lignes.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

# Le joker `*` vaut pour la ressource comme pour l'action : il sert à
# l'administrateur, seul rôle dont le périmètre est « tout ».
[matchers]
m = g(r.sub, p.sub) && (p.obj == "*" || r.obj == p.obj) && (p.act == "*" || r.act == p.act)
