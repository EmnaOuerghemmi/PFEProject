# PIQBIT — services d'infrastructure (Redis + PostgreSQL)
# Valeurs alignées sur backend/.env :
#   REDIS_URL=redis://localhost:6379
#   DATABASE_URL=postgresql+asyncpg://postgres:root@localhost:5433/piqbit
#
# NOTE PORTS : ce poste fait tourner DEUX services PostgreSQL Windows —
# postgresql-x64-17 sur 5432 et postgresql-x64-16 sur 5433. Sous Windows,
# plusieurs processus peuvent écouter le même port sans erreur : le conteneur
# semblait donc démarré alors que les connexions partaient en réalité vers le
# PostgreSQL Windows (constaté : `docker exec` voyait 0 table, une connexion
# TCP sur le même port en voyait 23). On publie donc ce conteneur sur 5434,
# port vérifié libre. À l'intérieur du réseau Docker, les services continuent
# de dialoguer sur le port standard 5432 via le nom d'hôte `postgres`.
#
# Démarrer :   docker compose up -d
# Arrêter  :   docker compose down        (ajouter -v pour effacer les données)
# Logs     :   docker compose logs -f

services:
  redis:
    image: redis:7-alpine
    container_name: piqbit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    # pgvector/pgvector:pg16 = PostgreSQL 16 + extension `vector` préinstallée
    # (matching sémantique). NOTE : si le volume pg-data a été initialisé avec
    # l'ancienne image postgres:16-alpine (musl) et que le conteneur refuse de
    # démarrer ou que des erreurs de collation apparaissent, réinitialiser la
    # base de dev : `docker compose down -v && docker compose up -d` (les
    # données de démo sont re-seedées au boot du backend). Sans cette image,
    # le matching sémantique fonctionne quand même (fallback Python).
    image: pgvector/pgvector:pg16
    container_name: piqbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: piqbit
      HF_TOKEN: ${HF_TOKEN}
    ports:
      # 5434 côté hôte : 5432 et 5433 sont déjà pris par les services Windows.
      - "5434:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d piqbit"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Application ─────────────────────────────────────────────────────────
  # Les services applicatifs sont dans le profil `app` : `docker compose up -d`
  # ne démarre donc que l'infrastructure (comportement historique, pratique
  # quand on lance backend et frontend à la main en développement).
  # Pile complète :  docker compose --profile app up -d --build
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: piqbit-backend
    profiles: ["app"]
    restart: unless-stopped
    environment:
      # Noms de services Docker, pas localhost : à l'intérieur du réseau, on
      # joint PostgreSQL sur son port standard 5432 (le 5434 ne concerne que
      # la publication vers l'hôte).
      DATABASE_URL: postgresql+asyncpg://postgres:root@postgres:5432/piqbit
      REDIS_URL: redis://redis:6379
      # Le frontend étant servi par nginx sur la même origine, aucune requête
      # n'est cross-origin : la liste peut rester vide. La renseigner
      # uniquement si une autre application appelle l'API directement.
      ALLOWED_ORIGINS: ""
      ALLOW_LOCALHOST_ORIGINS: "false"
      DEBUG: "false"
      # Ollama tourne sur la machine hôte, pas dans ce réseau : depuis le
      # conteneur, `localhost` désignerait le conteneur lui-même. NB : Ollama
      # n'écoute par défaut que sur 127.0.0.1 de l'hôte ; si le conteneur ne
      # le joint pas, lancer Ollama avec OLLAMA_HOST=0.0.0.0 — en sachant que
      # son API, sans authentification, devient alors visible du réseau local.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    # Nécessaire sous Linux pour que `host.docker.internal` existe ; Docker
    # Desktop (Windows, macOS) le fournit déjà, la ligne y est sans effet.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      # Fournit SECRET_KEY (obligatoire) et les secrets optionnels : SMTP,
      # Google OAuth. Sans SECRET_KEY, le backend s'arrête au démarrage avec
      # une erreur pydantic explicite.
      # NB : les valeurs ci-dessus (`environment:`) priment sur ce fichier —
      # DATABASE_URL pointe donc bien vers le conteneur, pas vers le
      # localhost:5434 utilisé en développement.
      - path: ./backend/.env
        required: false
    volumes:
      # CV téléversés : doivent survivre à la recréation du conteneur.
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: piqbit-frontend
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  redis-data:
  pg-data:
  uploads:
